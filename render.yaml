services:
  # ---------------------------------------------
  # 1. Backend Express + Socket.IO WebRTC Server
  # ---------------------------------------------
  - type: web
    name: coach-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false

  # ---------------------------------------------
  # 2. Frontend Nuxt 3 Application
  # ---------------------------------------------
  - type: web
    name: coach-client
    runtime: node
    plan: free
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NUXT_PUBLIC_API_URL
        fromService:
          type: web
          name: coach-server
          property: url
